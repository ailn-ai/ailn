name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify repository
        run: node scripts/verify.mjs

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: sensitivity scan
        run: node scripts/scan.mjs .

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run every conformance check
        run: npm run conformance

  example:
    runs-on: ubuntu-latest
    # This job calls the live API. A network outage there is not a repository failure, so it is
    # reported but does not gate the build. Everything deterministic is gated by `conformance`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run live quote example
        run: node examples/mcp-quote/index.mjs
